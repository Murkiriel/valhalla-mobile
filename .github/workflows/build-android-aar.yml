# Builds the Android AAR of this tag entirely from source (Valhalla submodule + vcpkg + NDK, same toolchain as
# android.yml), runs the instrumented tests on an emulator and attaches the AAR and its sha256 to a release of this
# fork. Proves the library can be rebuilt without the upstream Maven Central artifact.
name: Build Android AAR

on:
  push:
    branches: ["build-*"]
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg && git -C vcpkg checkout 2025.10.17
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Build native library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: chmod +x gradlew && ./gradlew buildValhallaFor-${{ matrix.arch }}
        working-directory: android

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: libvalhalla-${{ matrix.arch }}
          path: android/valhalla/src/main/jniLibs/${{ matrix.arch }}/libvalhalla-wrapper.so
          retention-days: 7

  aar:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libvalhalla-*
          path: native

      - name: Place native libraries
        run: |
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p android/valhalla/src/main/jniLibs/$arch
            cp native/libvalhalla-$arch/libvalhalla-wrapper.so android/valhalla/src/main/jniLibs/$arch/
          done

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      # The Android Gradle Plugin strips debug symbols only when it finds the NDK it expects inside the SDK; on newer
      # runner images it logs "Unable to strip ... packaging them as they are" and the AAR grows from ~10 MB to
      # ~130 MB. Strip here with the NDK's llvm-strip, the same tool and flag the plugin uses.
      - name: Strip native libraries
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
              android/valhalla/src/main/jniLibs/$arch/libvalhalla-wrapper.so
          done
          ls -l android/valhalla/src/main/jniLibs/*/libvalhalla-wrapper.so

      - name: Assemble AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: chmod +x gradlew && ./gradlew :valhalla:assembleRelease
        working-directory: android

      - name: Collect AAR and checksums
        run: |
          version=$(cat version.txt)
          mkdir dist
          cp android/valhalla/build/outputs/aar/valhalla-release.aar dist/valhalla-mobile-$version.aar
          (cd android/valhalla/src/main/jniLibs && sha256sum */libvalhalla-wrapper.so) > dist/native-sha256.txt
          (cd dist && sha256sum valhalla-mobile-$version.aar > valhalla-mobile-$version.aar.sha256)
          cat dist/*.sha256 dist/native-sha256.txt
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Compare with Maven Central
        run: |
          url="https://repo1.maven.org/maven2/io/github/rallista/valhalla-mobile/${VERSION}/valhalla-mobile-${VERSION}.aar"
          if curl -fsSL -o maven.aar "$url"; then
            built=$(sha256sum < dist/valhalla-mobile-$VERSION.aar | cut -d' ' -f1)
            published=$(sha256sum < maven.aar | cut -d' ' -f1)
            echo "built from source: $built"
            echo "Maven Central:     $published"
            if [ "$built" = "$published" ]; then
              echo "IDENTICAL to Maven Central" | tee dist/maven-central-comparison.txt
            else
              echo "::warning::differs from Maven Central" && echo "DIFFERS from Maven Central" > dist/maven-central-comparison.txt
            fi
            echo "built $built" >> dist/maven-central-comparison.txt
            echo "maven $published" >> dist/maven-central-comparison.txt
          else
            echo "::warning::version $VERSION not found on Maven Central"
          fi

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-mobile-aar
          path: dist/
          retention-days: 30

      - name: Publish release in this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${VERSION}"
          valhalla=$(git ls-tree HEAD src/valhalla | awk '{print $3}')
          gh release delete "$tag" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "valhalla-mobile ${VERSION} (built from source)" \
            --notes "Android AAR of tag ${VERSION} (Valhalla submodule at ${valhalla}) built from source by the Build Android AAR workflow, run ${GITHUB_RUN_ID}. Checksums attached."

  connected-check:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libvalhalla-*
          path: native

      - name: Place native libraries
        run: |
          for arch in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p android/valhalla/src/main/jniLibs/$arch
            cp native/libvalhalla-$arch/libvalhalla-wrapper.so android/valhalla/src/main/jniLibs/$arch/
          done

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected checks
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ndk: 29.0.14206865
          script: chmod +x gradlew && ./gradlew connectedCheck
          working-directory: android

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-reports
          path: android/**/build/reports
